# file: .github/workflows/reusable-ci-minimal.yml
# version: 1.0.0
# guid: c9d8e7f6-a5b4-3c2d-1e0f-9a8b7c6d5e4f
# last-edited: 2026-05-01

# Fast parallel CI for PRs and pushes. Runs short tests only.
# Uses manual actions/cache — NOT setup-go's built-in cache, which is unreliable.
# Full suite (property tests, coverage, E2E) runs nightly via reusable-ci.yml.

name: Reusable CI (Minimal / Fast)

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use'
        required: false
        type: string
        default: '1.26'
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '22'
      go-experiment:
        description: 'Value for GOEXPERIMENT env var (e.g. jsonv2)'
        required: false
        type: string
        default: ''
      system-packages:
        description: 'Space-separated apt packages to install before build/test (e.g. libtag1-dev)'
        required: false
        type: string
        default: ''
      frontend-working-dir:
        description: 'Path to the frontend directory relative to repo root (e.g. web)'
        required: false
        type: string
        default: 'web'
      run-frontend:
        description: 'Whether to run frontend lint/build/test jobs'
        required: false
        type: boolean
        default: true
      go-lint:
        description: 'Run golangci-lint. Opt-in (default false): consuming repos have their own .golangci.yml with their own backlog, and turning this on by default would fail their CI on findings they never agreed to gate on.'
        required: false
        type: boolean
        default: false
      golangci-lint-version:
        description: 'golangci-lint version to install (go install ...@<version>)'
        required: false
        type: string
        default: 'v2.12.2'
      golangci-lint-args:
        description: 'Extra args for `golangci-lint run`. Use --enable-only to scope which linters gate CI when the repo config enables more than CI should fail on (e.g. --enable-only interfacebloat,nolintlint).'
        required: false
        type: string
        default: ''
      super-linter:
        description: 'Run Super Linter in ADVISORY mode (reports, never fails the build). Opt-in.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-minimal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Go: vet + build ─────────────────────────────────────────────────────────
  go-vet-build:
    name: Go Vet & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOEXPERIMENT: ${{ inputs.go-experiment }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false

      - name: Restore Go cache (manual)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ inputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ inputs.go-version }}-
            ${{ runner.os }}-go-

      - name: Install system packages
        if: inputs.system-packages != ''
        env:
          PACKAGES: ${{ inputs.system-packages }}
        run: |
          # shellcheck disable=SC2086
          sudo apt-get update && sudo apt-get install -y $PACKAGES

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  # ── Go: short tests (skip property/slow tests via -short) ───────────────────
  go-test-short:
    name: Go Tests (short, race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOEXPERIMENT: ${{ inputs.go-experiment }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false

      - name: Restore Go cache (manual)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ inputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ inputs.go-version }}-
            ${{ runner.os }}-go-

      - name: Install system packages
        if: inputs.system-packages != ''
        env:
          PACKAGES: ${{ inputs.system-packages }}
        run: |
          # shellcheck disable=SC2086
          sudo apt-get update && sudo apt-get install -y $PACKAGES

      - name: Test (short, race)
        run: go test -short -race -timeout 30m ./...

  # ── Go: golangci-lint (opt-in) ──────────────────────────────────────────────
  go-lint:
    name: Go Lint
    if: inputs.go-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOEXPERIMENT: ${{ inputs.go-experiment }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up Go (no built-in cache)
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false

      - name: Restore Go cache (manual)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ inputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ inputs.go-version }}-
            ${{ runner.os }}-go-

      - name: Install system packages
        if: inputs.system-packages != ''
        env:
          PACKAGES: ${{ inputs.system-packages }}
        run: |
          # shellcheck disable=SC2086
          sudo apt-get update && sudo apt-get install -y $PACKAGES

      # Installed via `go install` rather than golangci-lint-action so the
      # version is pinned in this file's inputs and there is no extra third-party
      # action to SHA-pin and keep current.
      - name: Install golangci-lint
        env:
          GOLANGCI_VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_VERSION}"
          golangci-lint --version

      - name: golangci-lint run
        env:
          EXTRA_ARGS: ${{ inputs.golangci-lint-args }}
        run: |
          # shellcheck disable=SC2086
          golangci-lint run $EXTRA_ARGS ./...

  # ── Super Linter (opt-in, ADVISORY) ─────────────────────────────────────────
  super-linter:
    name: Super Linter (advisory)
    if: inputs.super-linter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Super Linter needs history to diff against the base branch when
          # VALIDATE_ALL_CODEBASE=false.
          fetch-depth: 0

      # Loads super-linter-pr.env (or super-linter-ci.env off a PR) from the repo
      # root into GITHUB_ENV. Same file convention ghcommon itself uses. Blank
      # lines and # comments are skipped; everything else must be KEY=VALUE.
      - name: Load Super Linter config
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -f super-linter-pr.env ]; then
            cfg=super-linter-pr.env
          elif [ -f super-linter-ci.env ]; then
            cfg=super-linter-ci.env
          else
            echo "No super-linter-*.env at repo root; using Super Linter defaults."
            cfg=""
          fi
          if [ -n "$cfg" ]; then
            echo "Loading $cfg"
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$cfg" >> "$GITHUB_ENV"
          fi

      # ADVISORY BY DESIGN. Two independent mechanisms, deliberately both:
      #   DISABLE_ERRORS=true  - Super Linter's own switch; it still reports every
      #                          finding but exits 0. This is the intent.
      #   continue-on-error    - the belt. DISABLE_ERRORS is set by the repo's env
      #                          file too, and a repo that ships DISABLE_ERRORS=false
      #                          would otherwise start hard-failing its own PRs the
      #                          moment it opts in. The env block below wins over the
      #                          loaded file, but continue-on-error means a future
      #                          rename or removal of the flag upstream still cannot
      #                          block anyone.
      - name: Run Super Linter
        continue-on-error: true
        uses: super-linter/super-linter@9e863354e3ff62e0727d37183162c4a88873df41 # v8.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLE_ERRORS: 'true'

  # ── Frontend: lint + build ───────────────────────────────────────────────────
  frontend-lint-build:
    name: Frontend Lint & Build
    if: ${{ inputs.run-frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.frontend-working-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Restore npm cache (manual)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ inputs.node-version }}-${{ hashFiles(format('{0}/package-lock.json', inputs.frontend-working-dir)) }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ inputs.node-version }}-
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        continue-on-error: false
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Frontend: unit tests ─────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Unit Tests
    if: ${{ inputs.run-frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.frontend-working-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Restore npm cache (manual)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ inputs.node-version }}-${{ hashFiles(format('{0}/package-lock.json', inputs.frontend-working-dir)) }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ inputs.node-version }}-
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --run

  # ── Summary ──────────────────────────────────────────────────────────────────
  ci-minimal-summary:
    name: Minimal CI Summary
    needs:
      [
        go-vet-build,
        go-test-short,
        go-lint,
        super-linter,
        frontend-lint-build,
        frontend-test,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        env:
          VET_BUILD: ${{ needs.go-vet-build.result }}
          TEST_SHORT: ${{ needs.go-test-short.result }}
          GO_LINT: ${{ needs.go-lint.result }}
          SUPER_LINTER: ${{ needs.super-linter.result }}
          FE_LINT_BUILD: ${{ needs.frontend-lint-build.result }}
          FE_TEST: ${{ needs.frontend-test.result }}
        run: |
          {
            printf '## Minimal CI Results\n\n'
            printf '| Job | Result |\n|-----|--------|\n'
            printf '| Go Vet & Build | %s |\n' "$VET_BUILD"
            printf '| Go Tests (short) | %s |\n' "$TEST_SHORT"
            printf '| Go Lint | %s |\n' "$GO_LINT"
            printf '| Super Linter (advisory) | %s |\n' "$SUPER_LINTER"
            printf '| Frontend Lint & Build | %s |\n' "$FE_LINT_BUILD"
            printf '| Frontend Unit Tests | %s |\n' "$FE_TEST"
          } >> "$GITHUB_STEP_SUMMARY"

          # go-lint IS a gate when opted in: it must reach this aggregator or a
          # lint failure would be invisible to a caller whose required check is
          # this summary job. super-linter is deliberately NOT in this list - it
          # is advisory and reports into the table only.
          failed=0
          for result in "$VET_BUILD" "$TEST_SHORT" "$GO_LINT"; do
            if [ "$result" = "failure" ]; then
              failed=1
            fi
          done
          # Frontend jobs may be skipped if run-frontend=false, and go-lint /
          # super-linter are skipped when not opted in; skip != failure.
          for result in "$FE_LINT_BUILD" "$FE_TEST"; do
            if [ "$result" = "failure" ]; then
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All minimal CI jobs passed"
